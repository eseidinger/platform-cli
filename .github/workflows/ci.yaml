---
name: CLI CI
"on":
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: python3 -m pip install -e '.[dev]' build twine ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/cli-release.py
      - run: devplat contract check --output json
      - run: python3 -m pytest tests
      - run: python3 -m build --outdir dist .
      - run: python3 -m twine check dist/*
      - name: Test installed wheel
        run: |
          python3 -m pip uninstall -y developer-platform-cli
          python3 -m pip install dist/*.whl
          python3 -m pytest tests
          devplat contract check --output json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-distributions
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-distributions
          path: dist
      - name: Publish tested distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
